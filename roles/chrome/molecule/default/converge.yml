---
# Installs the Chrome stable milestone that prepare.yml resolved and pinned, so
# the idempotence re-run targets the same major even if Google promotes a new
# stable between the two converges. Real playbooks use the default channel.
# The milestone is deliberately passed as a bare int: under ansible-core 2.19+
# native templating this reaches the role as an int, exactly like a caller
# writing `chrome_version: 127`, which used to break the install task.
# chromedriver is enabled because it shares the same version handling and is a
# small download.
- name: Converge
  hosts: all
  become: true
  pre_tasks:
    - name: Read the pinned chrome version
      ansible.builtin.slurp:
        src: /var/tmp/molecule-chrome-version
      register: chrome_pinned_version
  roles:
    - role: tborealis.roles.chrome
      vars:
        chrome_version: "{{ chrome_pinned_version.content | b64decode | trim | split('.') | first | int }}"
        chrome_install_chromedriver: true
