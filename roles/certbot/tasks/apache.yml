---
- name: Install apache plugin
  ansible.builtin.apt:
    name: python3-certbot-apache
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Process certificates
  with_items: "{{ certbot_certs }}"
  ansible.builtin.include_tasks: apache-certs.yml
  loop_control:
    loop_var: certbot_certs_item
    label: "{{ certbot_certs_item.name }}"
  when: certbot_certs|length > 0

- name: Install and enable SSL vhosts
  ansible.builtin.include_tasks: apache-ssl-vhosts.yml
